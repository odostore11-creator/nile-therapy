# Publishes the public/ folder to GitHub Pages on every push to main.
# Live at https://niletherapyport.site/ (custom domain; the github.io address redirects there)
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['public/**', 'scripts/check.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Safety checks (syntax, missing files, English/Arabic text, no secrets). If any fail, nothing is published.
      - name: Check the site
        run: node scripts/check.mjs
      # Stamp this deploy's version on our CSS/JS links so browsers never mix old and new files.
      - name: Stamp file versions
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" public/index.html && grep -c "?v=${GITHUB_SHA::7}" public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
