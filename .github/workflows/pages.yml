# Publishes the public/ folder to GitHub Pages on every push to main.
# Live at https://odostore11-creator.github.io/nile-therapy/
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['public/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Stamp this deploy's version on our CSS/JS links so browsers never mix old and new files.
      - name: Stamp file versions
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" public/index.html && grep -c "?v=${GITHUB_SHA::7}" public/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
